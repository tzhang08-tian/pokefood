<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>upload a food</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 1.2rem;
    padding: 2rem; background: #fff; color: #000;
    font-family: 'Ubuntu Condensed', 'Ubuntu', 'Helvetica Neue', Arial, sans-serif;
    text-align: center;
  }
  h1 { font-size: 22px; font-weight: 400; letter-spacing: .06em; }
  label.pick {
    display: block; width: 100%; max-width: 320px; padding: 1.1rem;
    border: 1px solid #000; font-size: 16px; letter-spacing: .1em;
    text-transform: uppercase; cursor: pointer;
  }
  label.pick input { display: none; }
  #preview { max-width: 100%; max-height: 40vh; display: none; border: 1px solid #000; }
  #status { font-size: 15px; color: #444; min-height: 1.4em; }
  #status.err { color: #b00020; }
  #result { display: none; width: 100%; max-width: 340px; flex-direction: column; gap: .9rem; align-items: center; }
  #result img { width: 100%; height: auto; border: 1px solid #000; }
  #result button {
    width: 100%; padding: 1.1rem; background: #000; color: #fff; border: 1px solid #000;
    font: inherit; font-size: 16px; letter-spacing: .1em; text-transform: uppercase; cursor: pointer;
  }
  #result small { font-size: 13px; color: #666; }
</style>
</head>
<body>
  <h1>upload a food to generate your character</h1>
  <label class="pick">choose / take photo<input type="file" id="file" accept="image/*"></label>
  <img id="preview" alt="">
  <div id="status"></div>
  <div id="result">
    <img id="card-img" alt="your card">
    <button id="save-btn">save to photos</button>
    <small>if nothing happens, press and hold the card and choose “Save Image”</small>
  </div>

<script>
const sid = new URLSearchParams(location.search).get('s') || '';
// Stable per-device id: the server uses it to cap each person at a few cards
let pid = '';
try { pid = localStorage.getItem('cf_user_id') || ''; } catch (e) {}
if (!/^[A-Za-z0-9_-]{8,64}$/.test(pid)) {
  pid = 'user_' + Date.now() + '_' + Math.random().toString(36).slice(2, 11);
  try { localStorage.setItem('cf_user_id', pid); } catch (e) {}
}
// Owner helper: open mobile.html?myid to see this device's id (for UNLIMITED_IDS on the server)
if (new URLSearchParams(location.search).has('myid')) {
  const b = document.createElement('div');
  b.style.cssText = 'position:fixed;inset:auto 12px 12px 12px;background:#fff;color:#000;padding:12px;border-radius:10px;font:13px monospace;word-break:break-all;z-index:99;user-select:all';
  b.textContent = pid;
  document.body.appendChild(b);
}
const statusEl = document.getElementById('status');
const say = (t, err) => { statusEl.textContent = t; statusEl.className = err ? 'err' : ''; };
if (!sid) say('This link is missing its session code — scan the QR code again.', true);

// Downscale + re-encode so the upload stays well under the server's size limit
function compress(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      let dim = 1280, q = 0.85, out = '';
      for (let i = 0; i < 6; i++) {
        const k = Math.min(1, dim / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        out = c.toDataURL('image/jpeg', q);
        if (out.length < 700000) break;
        dim *= 0.8; q = Math.max(0.55, q - 0.08);
      }
      resolve(out);
    };
    img.onerror = () => reject(new Error('Could not read that image.'));
    img.src = URL.createObjectURL(file);
  });
}

document.getElementById('file').addEventListener('change', async e => {
  const f = e.target.files[0];
  if (!f || !sid) return;
  try {
    say('sending…');
    // ignore any card from an earlier round; only a newly sent one should show up
    document.getElementById('result').style.display = 'none';
    try { cardUrl = (await (await fetch('/api/session?kind=result&id=' + encodeURIComponent(sid), { cache: 'no-store' })).json()).image || ''; } catch (e) {}
    const image = await compress(f);
    const p = document.getElementById('preview');
    p.src = image; p.style.display = 'block';
    const r = await fetch('/api/session', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: sid, image, pid }),
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || `upload failed (${r.status})`);
    say('sent — look at your computer ✓ · your card will appear here when it’s ready');
    waitForCard();
  } catch (err) {
    say(err.message, true);
  }
});

// Wait for the desktop to send the finished card back, then offer it for saving
let polling = false, cardUrl = '';
function waitForCard() {
  if (polling) return;
  polling = true;
  const t = setInterval(async () => {
    if (document.hidden) return;
    try {
      const r = await fetch('/api/session?kind=result&id=' + encodeURIComponent(sid), { cache: 'no-store' });
      const { image } = await r.json();
      if (!image || image === cardUrl) return;
      cardUrl = image;
      document.getElementById('card-img').src = image;
      document.getElementById('result').style.display = 'flex';
      document.getElementById('preview').style.display = 'none';
      say('your card is ready ✓');
    } catch (e) {}
  }, 2000);
}
if (sid) waitForCard();

document.getElementById('save-btn').addEventListener('click', async () => {
  try {
    const blob = await (await fetch(cardUrl)).blob();
    const file = new File([blob], 'pokefood-card.jpg', { type: blob.type || 'image/jpeg' });
    // iOS / Android share sheet → "Save Image" puts it straight into the photo library
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file] });
      return;
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'pokefood-card.jpg';
    document.body.appendChild(a); a.click(); a.remove();
  } catch (e) {
    if (e.name !== 'AbortError') say('Could not save — press and hold the card and choose “Save Image”.', true);
  }
});
</script>
</body>
</html>
